<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road Rush</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>ARCADE DRIVING</small><h1>ROAD <b>RUSH</b></h1></div><section class="stats"><div>SPEED<strong id="speed">0</strong>KM/H</div><div>DISTANCE<strong id="distance">0</strong>M</div><div>SCORE<strong id="score">0</strong>PTS</div></section></header><div class="stage"><canvas id="game" width="900" height="600"></canvas><div class="overlay" id="start"><article><small>READY TO DRIVE?</small><h2>Start your engine</h2><p>Steer around traffic, brake when needed and travel as far as you can.</p><button id="play">START GAME</button></article></div><div class="overlay hidden" id="over"><article><small>DRIVE COMPLETE</small><h2>Nice driving!</h2><p id="result"></p><button id="again">PLAY AGAIN</button></article></div></div><section class="controls"><div><label>STEERING</label><div class="pair"><button id="left">◀</button><button id="right">▶</button></div></div><div class="pair"><div><label>BRAKE</label><button class="brake" id="brake">BRAKE</button></div><div><label>ACCELERATOR</label><button class="gas" id="gas">GO!</button></div></div></section><footer>Keyboard: ← → steer · ↓ brake · ↑ accelerate <span>👨‍✈️ Driver on board</span></footer></main><script src="script.js"></script></body></html>
